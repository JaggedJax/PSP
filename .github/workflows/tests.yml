name: Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: psp_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: curl, dom, ftp, mbstring, pcntl, pdo, pdo_mysql, posix
        coverage: none

    - name: Validate composer.json
      run: composer validate

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Load database schema
      run: mysql -h127.0.0.1 -uroot -proot psp_test < db/schema.sql

    - name: Code style
      run: vendor/bin/php-cs-fixer fix --dry-run --diff

    - name: PHPStan
      run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

    - name: Unit tests
      run: php -d auto_prepend_file=vendor/antecedent/patchwork/Patchwork.php vendor/bin/phpunit --testsuite Unit

    - name: Database tests
      run: php -d auto_prepend_file=vendor/antecedent/patchwork/Patchwork.php vendor/bin/phpunit --testsuite Database
